name: workflow

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint code
        run: python -m compileall -q app.py src scripts tests
      # The knowledge-base / retriever tests need scikit-learn only: no
      # TensorFlow, no model download, so the job stays under a minute.
      - name: Install test dependencies
        run: pip install scikit-learn==1.5.2
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
